services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/internal_requests.db
      JWT_SECRET_KEY: local-compose-secret
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
